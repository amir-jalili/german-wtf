<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Grammatik Gym logo: an umlaut over a dumbbell">
  <!-- Original Grammatik Gym mark: the two dots of an umlaut (ü) above a dumbbell. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512"  fill="url(#bg)"/>
  <g fill="#ffffff" transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <circle cx="196" cy="156" r="34"/>
    <circle cx="316" cy="156" r="34"/>
    <rect x="150" y="286" width="212" height="28" rx="14"/>
    <rect x="88" y="236" width="40" height="128" rx="12"/>
    <rect x="128" y="256" width="30" height="88" rx="10"/>
    <rect x="354" y="256" width="30" height="88" rx="10"/>
    <rect x="384" y="236" width="40" height="128" rx="12"/>
  </g>
</svg>
