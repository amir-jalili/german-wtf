# Deploys main to GitHub Pages as a project site: https://<owner>.github.io/<repo>/ (now german-wtf)
# (ADR 0004). The app is built with BASE_PATH so all URLs, the manifest and the service
# worker live under /<repo>.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Guard — no book content in the public build (ADR 0003)
        run: |
          if grep -rlE '"origin"\s*:|"source"\s*:\s*"book-' build/content 2>/dev/null; then
            echo "Book-based items found in the public build"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
