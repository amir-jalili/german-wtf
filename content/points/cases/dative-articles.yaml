id: dative-articles
title: { en: "Dativ: articles and nouns (Dativ plural -n)", de: "Dativ: Artikel und Nomen (Dativ-Plural -n)" }
level: A2
family: cases
prerequisites: [dative-basic-mit-bei-zu]
compareWith: [accusative-articles, genitive-articles]
version: 1
lesson:
  summary: "In the Dativ every article changes: dem, der, dem, den. In the plural the noun adds -n too: mit den Kindern."
  rule: |
    The **Dativ** answers *Wem?* (to/for whom?). You need it after the prepositions **mit, bei, nach, aus, zu, von, seit** and after verbs like **helfen, danken, gehören, gefallen, schmecken, antworten, gratulieren**. With *geben, schenken, zeigen, schreiben* the person who receives something is in the Dativ.

    The articles:
    - masculine and neuter: **dem** / **einem**
    - feminine: **der** / **einer**
    - plural: **den** (no indefinite article)

    **Dativ plural adds -n to the noun**: *die Kinder → mit den Kinder**n***. Nouns whose plural already ends in **-n** add nothing (*den Blumen*), and plurals in **-s** never take -n (*mit den Autos*).
  table:
    columns: [m, f, n, pl]
    rows:
      "Nominativ": ["der / ein Mann", "die / eine Frau", "das / ein Kind", "die Kinder"]
      "Akkusativ": ["den / einen Mann", "die / eine Frau", "das / ein Kind", "die Kinder"]
      "Dativ": ["dem / einem Mann", "der / einer Frau", "dem / einem Kind", "den Kindern"]
  examples:
    - de: "Ich fahre mit dem Bus."
      en: "I'm going by bus."
      xray:
        - { text: "Ich", role: subj, case: nom }
        - { text: "mit dem Bus", role: prep-obj, case: dat, gender: m, note: "mit + Dativ" }
    - de: "Murat hilft der Nachbarin."
      en: "Murat helps the neighbour."
      xray:
        - { text: "Murat", role: subj, case: nom }
        - { text: "der Nachbarin", role: dat-obj, case: dat, gender: f, note: "helfen + Dativ" }
    - de: "Lena gibt dem Kind einen Apfel."
      en: "Lena gives the child an apple."
      xray:
        - { text: "Lena", role: subj, case: nom }
        - { text: "dem Kind", role: dat-obj, case: dat, gender: n, note: "who receives: Dativ" }
        - { text: "einen Apfel", role: akk-obj, case: akk, gender: m, note: "what is given: Akkusativ" }
    - de: "Wir spielen mit den Kindern."
      en: "We're playing with the children."
      xray:
        - { text: "Wir", role: subj, case: nom }
        - { text: "mit den Kindern", role: prep-obj, case: dat, gender: pl, note: "Dativ plural: den + noun -n" }
  pitfalls:
    - "Feminine Dativ is *der*, which looks like masculine Nominativ: *mit der Freundin*, not *mit die Freundin*."
    - "Don't forget the **-n** in the Dativ plural: *mit den Freunde**n***."
    - "Plurals in **-s** never get -n: *mit den Handys*, *in den Hotels*."
items:
  - id: dative-articles/001
    type: cloze
    level: A2
    skill: form
    text: "Ich fahre mit {{dem}} Bus zur Uni."
    hint: "(der Bus)"
    accepted: [dem]
    explanation: "*mit* always takes the Dativ; masculine *der* → *dem*."
    errorTags: [article-form, preposition-case]
    distractorNotes:
      den: "*den* is Akkusativ. *mit* always takes the Dativ → *dem*."
      der: "*der* is the Nominativ form of *der Bus*. After *mit* → Dativ *dem*."
    review: { status: verified, by: claude-blind-solve, date: 2026-11-17 }
    source: original
