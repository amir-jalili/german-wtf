id: accusative-articles
title: { en: "Accusative: articles", de: "Akkusativ: Artikel" }
level: A1
family: cases
prerequisites: [noun-gender-articles]
compareWith: [dative-articles]
version: 1
lesson:
  summary: "The direct object takes the Akkusativ. Only masculine changes: der → den, ein → einen. Feminine, neuter and plural look exactly like the Nominativ."
  rule: |
    The **direct object** (the thing or person the action is done to) stands in the **Akkusativ**.
    Ask *Wen oder was?* — *Ich kaufe **den Tisch**.*

    Only the **masculine** forms change:
    - der → **den** · *Ich sehe den Mann.*
    - ein → **einen** · *Ich habe einen Hund.*

    Feminine (*die/eine*), neuter (*das/ein*) and plural (*die*) stay the same as in the Nominativ.

    Typical Akkusativ verbs: *haben, brauchen, kaufen, sehen, suchen, essen, trinken, lesen, kennen, nehmen* and *es gibt*.
  table:
    columns: [m, f, n, pl]
    rows:
      "Nominativ (der)": ["der Tisch", "die Lampe", "das Bett", "die Stühle"]
      "Akkusativ (der)": ["den Tisch", "die Lampe", "das Bett", "die Stühle"]
      "Nominativ (ein)": ["ein Tisch", "eine Lampe", "ein Bett", "– Stühle"]
      "Akkusativ (ein)": ["einen Tisch", "eine Lampe", "ein Bett", "– Stühle"]
  examples:
    - de: "Ich kaufe den Tisch."
      en: "I'm buying the table."
      xray:
        - { text: "Ich", role: subj, case: nom }
        - { text: "kaufe", role: verb }
        - { text: "den Tisch", role: akk-obj, case: akk, gender: m }
    - de: "Lena hat einen Bruder."
      en: "Lena has a brother."
      xray:
        - { text: "Lena", role: subj, case: nom }
        - { text: "hat", role: verb }
        - { text: "einen Bruder", role: akk-obj, case: akk, gender: m }
    - de: "Wir brauchen eine Lampe."
      en: "We need a lamp."
      xray:
        - { text: "Wir", role: subj, case: nom }
        - { text: "brauchen", role: verb }
        - { text: "eine Lampe", role: akk-obj, case: akk, gender: f, note: "feminine: no change" }
    - de: "Er trinkt das Wasser."
      en: "He drinks the water."
      xray:
        - { text: "Er", role: subj, case: nom }
        - { text: "trinkt", role: verb }
        - { text: "das Wasser", role: akk-obj, case: akk, gender: n, note: "neuter: no change" }
    - de: "Kofi sucht die Schlüssel."
      en: "Kofi is looking for the keys."
      xray:
        - { text: "Kofi", role: subj, case: nom }
        - { text: "sucht", role: verb }
        - { text: "die Schlüssel", role: akk-obj, case: akk, gender: pl, note: "plural: no change" }
  pitfalls:
    - "Only masculine changes. If you wrote *eine Tisch* or *das Mann*, the problem is the gender, not the case."
    - "Don't \"fix\" feminine or neuter nouns: *die Frau* and *das Kind* stay the same in the Akkusativ."
    - "The subject (*Wer?*) stays Nominativ even when it comes later: *Den Kuchen isst **der** Hund.*"
items:
  - id: accusative-articles/001
    type: cloze
    level: A1
    skill: form
    text: "Ich kaufe {{den}} Tisch."
    hint: "(der Tisch)"
    accepted: [den]
    explanation: "Direct object → Akkusativ. Masculine *der* becomes *den*."
    errorTags: [article-form, case]
    distractorNotes:
      der: "*der* is Nominativ. The table is the direct object (wen oder was kaufe ich?) → *den*."
      dem: "*dem* is Dativ. *kaufen* takes the Akkusativ → *den*."
    review: { status: verified, by: claude-blind-solve, date: 2026-11-17 }
    source: original
