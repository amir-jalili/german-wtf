id: two-way-prepositions
title: { en: "Two-way prepositions: wo? (Dativ) / wohin? (Akkusativ)", de: "Wechselpräpositionen: wo? (Dativ) / wohin? (Akkusativ)" }
level: A2
family: prepositions
prerequisites: [dative-prepositions, accusative-prepositions]
compareWith: [dative-prepositions, position-verbs]
version: 1
lesson:
  summary: "Nine prepositions take the Dativ for a location (wo?) and the Akkusativ for a direction (wohin?)."
  rule: |
    **an, auf, hinter, in, neben, über, unter, vor, zwischen** are *Wechselpräpositionen*: they switch case.

    - **Wo?** (where something *is*, no change of place) → **Dativ** · *Das Buch liegt auf **dem** Tisch.*
    - **Wohin?** (where something *goes*, movement to a new place) → **Akkusativ** · *Ich lege das Buch auf **den** Tisch.*

    Verb pairs help: *liegen, stehen, sitzen, hängen (is hanging)* → Dativ; *legen, stellen, setzen, hängen (hang something)* → Akkusativ. Verbs of moving to a place (*gehen, fahren, bringen, springen*) usually take the Akkusativ.

    Contractions: *in dem → im*, *an dem → am*, *in das → ins*, *an das → ans*.
  table:
    columns: [m, f, n, pl]
    rows:
      "Dativ (wo?)": ["auf dem Tisch", "an der Wand", "in dem (im) Haus", "zwischen den Stühlen"]
      "Akkusativ (wohin?)": ["auf den Tisch", "an die Wand", "in das (ins) Haus", "zwischen die Stühle"]
  examples:
    - de: "Die Katze schläft auf dem Sofa."
      en: "The cat is sleeping on the sofa."
      xray:
        - { text: "Die Katze", role: subj, case: nom, gender: f }
        - { text: "auf dem Sofa", role: prep-obj, case: dat, gender: n, note: "wo? → Dativ" }
    - de: "Die Katze springt auf das Sofa."
      en: "The cat jumps onto the sofa."
      xray:
        - { text: "Die Katze", role: subj, case: nom, gender: f }
        - { text: "auf das Sofa", role: prep-obj, case: akk, gender: n, note: "wohin? → Akkusativ" }
    - de: "Das Bild hängt an der Wand."
      en: "The picture is hanging on the wall."
      xray:
        - { text: "Das Bild", role: subj, case: nom, gender: n }
        - { text: "an der Wand", role: prep-obj, case: dat, gender: f, note: "wo? → Dativ" }
    - de: "Ich hänge das Bild an die Wand."
      en: "I'm hanging the picture on the wall."
      xray:
        - { text: "Ich", role: subj, case: nom }
        - { text: "das Bild", role: akk-obj, case: akk, gender: n }
        - { text: "an die Wand", role: prep-obj, case: akk, gender: f, note: "wohin? → Akkusativ" }
  pitfalls:
    - "Ask *wo?* or *wohin?*, not \"is there movement?\": *Ich laufe im Park* (running around inside the park) is Dativ."
    - "*liegen/stehen/sitzen* → Dativ, *legen/stellen/setzen* → Akkusativ. The verb usually decides."
    - "Other prepositions never switch: *mit* is always Dativ, *für* always Akkusativ."
