id: subordinate-weil-dass
title: { en: "Subordinate clauses with weil and dass (verb last)", de: "Nebensätze mit weil und dass (Verb am Ende)" }
level: A2
family: clauses
prerequisites: [word-order-v2]
compareWith: [conjunctions-aduso, adverbial-connectors]
version: 1
lesson:
  summary: "After weil (because) and dass (that) the conjugated verb goes to the very end of the clause."
  rule: |
    **weil** gives a reason (*warum?*), **dass** introduces what someone says, thinks or knows (*Ich glaube, dass …*).

    Both start a **subordinate clause** (*Nebensatz*): the **conjugated verb moves to the end**.
    - *Ich bleibe zu Hause. Ich **bin** krank.* → *Ich bleibe zu Hause, **weil** ich krank **bin**.*
    - With two verbs, the conjugated one is last: *…, weil ich arbeiten **muss**.* · *…, weil er lange gearbeitet **hat**.*

    The subject usually comes right after *weil/dass*. A **comma** always separates the clauses.

    Compare **denn** (also "because"): it does *not* move the verb — *…, denn ich **bin** krank.*
  examples:
    - de: "Ich bleibe zu Hause, weil ich krank bin."
      en: "I'm staying at home because I'm ill."
      xray:
        - { text: "Ich", role: subj, case: nom }
        - { text: "bleibe", role: verb }
        - { text: "bin", role: verb, note: "conjugated verb at the end" }
    - de: "Ich glaube, dass der Bus Verspätung hat."
      en: "I think the bus is late."
      xray:
        - { text: "der Bus", role: subj, case: nom, gender: m }
        - { text: "hat", role: verb, note: "verb last after dass" }
    - de: "Lena lernt Deutsch, weil sie in Berlin arbeiten will."
      en: "Lena is learning German because she wants to work in Berlin."
      xray:
        - { text: "arbeiten", role: verb-part }
        - { text: "will", role: verb, note: "the conjugated modal goes last" }
  pitfalls:
    - "Not *weil ich bin krank* — the verb goes last: *weil ich krank bin*."
    - "*dass* (conjunction, double s) ≠ *das* (article/pronoun)."
    - "*denn* keeps normal word order: *denn ich bin krank*."
