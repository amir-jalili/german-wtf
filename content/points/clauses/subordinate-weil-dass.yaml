    skill: syntax
    text: "Ich hoffe, ___ das Wetter morgen schön ist."
    options: [dass, weil, denn, das]
    answer: dass
    explanation: "After *hoffen* (what you hope) → *dass* + verb last."
    errorTags: [connector-choice]
    distractorNotes:
      weil: "*weil* gives a reason. Here the clause says *what* you hope → *dass*."
      denn: "*denn* needs normal word order and gives a reason → *dass*."
      das: "*das* is an article/pronoun. The conjunction is spelled *dass*."
    review: { status: verified, by: claude-blind-solve, date: 2026-11-17 }
    source: original
