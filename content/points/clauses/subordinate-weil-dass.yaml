    options: [weil, denn, dass, das]
    answer: weil
    explanation: "A reason with the verb at the end (*regnet*) → *weil*."
    errorTags: [connector-choice, verb-final]
    distractorNotes:
      denn: "After *denn* the verb would stay second: *denn es regnet sehr stark*. The verb is last here → *weil*."
      dass: "*dass* introduces what someone says or thinks. Here it's a reason → *weil*."
      das: "*das* is an article/pronoun, not a conjunction."
    review: { status: verified, by: claude-blind-solve, date: 2026-11-17 }
    source: original
