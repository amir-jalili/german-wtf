id: adj-endings-definite
title: { en: "Adjective endings after the definite article", de: "Adjektivdeklination nach bestimmtem Artikel" }
level: A2
family: adjectives
prerequisites: [dative-articles]
compareWith: [adj-endings-indefinite]
version: 1
lesson:
  summary: "After der/die/das the article already shows the case, so the adjective only takes -e or -en."
  rule: |
    After the definite article (and *dies-, jed-, welch-*), adjectives before a noun take the **weak** endings:

    - **-e** in the five "easy" spots: **Nominativ singular** (all genders) and **Akkusativ singular feminine and neuter**.
    - **-en** everywhere else: all **Dativ**, all **Genitiv**, all **plural**, and **Akkusativ masculine**.

    Memory trick: count the five *-e* spots — **der** Mann (Nom.), **die** Frau and **das** Haus (Nom. and Akk.). Everything else is *-en*, including Dativ feminine *der* (*mit der alten Frau*) and plural *die* (*die alten Häuser*).
  table:
    columns: [m, f, n, pl]
    rows:
      nom: ["der alte Mann", "die alte Frau", "das alte Haus", "die alten Häuser"]
      akk: ["den alten Mann", "die alte Frau", "das alte Haus", "die alten Häuser"]
      dat: ["dem alten Mann", "der alten Frau", "dem alten Haus", "den alten Häusern"]
      gen: ["des alten Mannes", "der alten Frau", "des alten Hauses", "der alten Häuser"]
  examples:
    - de: "Ich helfe dem alten Mann."
      en: "I'm helping the old man."
      xray:
        - { text: "Ich", role: subj, case: nom }
        - { text: "dem alten Mann", role: dat-obj, case: dat, gender: m, note: "Dativ → -en" }
    - de: "Die neue Wohnung ist hell."
      en: "The new flat is bright."
      xray:
        - { text: "Die neue Wohnung", role: subj, case: nom, gender: f, note: "Nominativ singular → -e" }
    - de: "Ich nehme den roten Pullover."
      en: "I'll take the red jumper."
      xray:
        - { text: "Ich", role: subj, case: nom }
        - { text: "den roten Pullover", role: akk-obj, case: akk, gender: m, note: "Akkusativ masculine → -en" }
    - de: "Die jungen Leute tanzen."
      en: "The young people are dancing."
      xray:
        - { text: "Die jungen Leute", role: subj, case: nom, gender: pl, note: "plural → -en" }
  pitfalls:
    - "Akkusativ masculine is *-en*, not *-e*: *den neuen Tisch*."
    - "Plural is always *-en* after the article: *die neuen Schuhe*."
    - "Adjectives after *sein/werden* take no ending: *Die Wohnung ist neu.*"
items:
