id: perfect-sein
title: { en: "Perfekt with sein", de: "Perfekt mit sein" }
level: A1
family: tenses
prerequisites: [perfect-haben]
compareWith: [perfect-haben]
version: 1
lesson:
  summary: "Verbs of movement from A to B and of change of state build the Perfekt with sein: Ich bin gefahren."
  rule: |
    Most verbs build the Perfekt with **haben**. A smaller group uses **sein**:

    - **movement from one place to another**: *gehen, fahren, fliegen, kommen, laufen, springen, wandern, reisen* · *Ich **bin** nach Berlin **gefahren**.*
    - **change of state**: *aufstehen, aufwachen, einschlafen, werden, sterben, wachsen* · *Er **ist** eingeschlafen.*
    - and three you just memorise: **sein, bleiben, passieren** · *Ich **bin** zu Hause **geblieben**.*

    Form: **sein** (conjugated, position 2) + **Partizip II** (at the end).
  table:
    columns: [Präsens von sein, Beispiel]
    rows:
      ich: ["bin", "Ich bin gekommen."]
      du: ["bist", "Du bist gekommen."]
      "er/sie/es": ["ist", "Sie ist gekommen."]
      wir: ["sind", "Wir sind gekommen."]
      ihr: ["seid", "Ihr seid gekommen."]
      "sie/Sie": ["sind", "Sie sind gekommen."]
  examples:
    - de: "Gestern bin ich nach Berlin gefahren."
      en: "Yesterday I went to Berlin."
      xray:
        - { text: "bin", role: verb, note: "sein: movement A → B" }
        - { text: "ich", role: subj, case: nom }
        - { text: "gefahren", role: verb-part, note: "Partizip II at the end" }
    - de: "Lena ist um sieben Uhr aufgestanden."
      en: "Lena got up at seven."
      xray:
        - { text: "Lena", role: subj, case: nom }
        - { text: "ist", role: verb, note: "sein: change of state" }
        - { text: "aufgestanden", role: verb-part }
    - de: "Wir haben den Zug genommen."
      en: "We took the train."
      xray:
        - { text: "Wir", role: subj, case: nom }
        - { text: "haben", role: verb, note: "nehmen has an object → haben" }
        - { text: "den Zug", role: akk-obj, case: akk, gender: m }
        - { text: "genommen", role: verb-part }
  pitfalls:
    - "Moving is not enough: it must be *to* somewhere or a change. *Ich habe getanzt* (haben), but *Ich bin nach Hause gegangen* (sein)."
    - "*bleiben* and *sein* take *sein* although nothing moves: *Ich bin geblieben. Ich bin gewesen.*"
    - "A verb with an Akkusativ object almost always takes *haben*: *Ich habe den Bus genommen.*"
items:
  - id: perfect-sein/001
    type: cloze
    level: A1
    skill: form
    text: "Gestern {{bin}} ich nach Hamburg {{gefahren}}."
    hint: "(fahren, Perfekt)"
    accepted: [[bin], [gefahren]]
    explanation: "*fahren* nach … is movement from A to B → *sein*: *ich bin gefahren*."
    errorTags: [aux-haben-sein, participle]
    distractorNotes:
      habe: "*fahren* to a place is movement A → B → Perfekt with *sein*: *bin*."
      gefahrt: "*fahren* is irregular: Partizip II *gefahren*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/002
