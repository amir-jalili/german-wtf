    level: A1
    skill: form
    text: "Wir ___ den Zug genommen."
    options: [haben, sind, hat, ist]
    answer: haben
    explanation: "*nehmen* has an Akkusativ object and no movement of the subject → *haben*."
    errorTags: [aux-haben-sein]
    distractorNotes:
      sind: "*nehmen* has an Akkusativ object (*den Zug*) → *haben*, even though you travel."
      hat: "Right auxiliary, wrong person: *wir haben*."
      ist: "*nehmen* → *haben*, and *wir* → *haben*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
