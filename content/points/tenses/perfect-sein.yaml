    accepted: [ist]
    explanation: "*aufstehen* is a change of state (lying → standing) → *sein*: *ist*."
    errorTags: [aux-haben-sein]
    distractorNotes:
      hat: "*aufstehen* is a change of state → *sein*: *sie ist aufgestanden*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/004
    type: cloze
    level: A1
    skill: form
    text: "Wann {{bist}} du nach Hause gekommen?"
    hint: "(kommen, Perfekt)"
    accepted: [bist]
    explanation: "*kommen* → movement → *sein*; for *du*: *bist*."
    errorTags: [aux-haben-sein, verb-conjugation]
    distractorNotes:
      hast: "*kommen* is movement → *sein*: *du bist gekommen*."
      ist: "Conjugate *sein* for *du*: *bist*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/005
