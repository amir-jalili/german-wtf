    level: A1
    skill: form
    text: "Wir {{sind}} ins Kino gegangen."
    hint: "(gehen, Perfekt)"
    accepted: [sind]
    explanation: "*gehen* → movement → *sein*; for *wir*: *sind*."
    errorTags: [aux-haben-sein]
    distractorNotes:
      haben: "*gehen* is movement → *sein*: *wir sind gegangen*."
