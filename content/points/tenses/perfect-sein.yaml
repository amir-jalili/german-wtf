    errorTags: [aux-haben-sein, participle]
    distractorNotes:
      Hast: "*sein* takes *sein* in the Perfekt: *Bist du … gewesen?*"
      geseid: "Partizip II of *sein* is *gewesen*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/011
    type: cloze
    level: A1
    skill: form
    text: "Ich {{bin}} heute sehr früh {{aufgewacht}}."
    hint: "(aufwachen, Perfekt)"
    accepted: [[bin], [aufgewacht]]
    explanation: "*aufwachen* is a change of state → *sein*; separable: *auf-ge-wacht*."
    errorTags: [aux-haben-sein, participle, separable-prefix]
    distractorNotes:
      habe: "*aufwachen* is a change of state (sleeping → awake) → *sein*."
      geaufwacht: "With separable verbs *ge-* goes after the prefix: *aufgewacht*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/012
