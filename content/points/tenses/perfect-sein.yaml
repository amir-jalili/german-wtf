    skill: form
    text: "Er ___ im Park eingeschlafen."
    options: [ist, hat, bin, habe]
    answer: ist
    explanation: "*einschlafen* is a change of state (awake → asleep) → *sein*: *er ist*."
    errorTags: [aux-haben-sein]
    distractorNotes:
      hat: "*einschlafen* is a change of state → *sein*: *er ist eingeschlafen*."
      bin: "Right auxiliary, wrong person: *er ist*."
      habe: "*einschlafen* → *sein*, and *er* → *ist*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/014
