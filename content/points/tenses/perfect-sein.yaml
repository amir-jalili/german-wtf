    errorTags: [participle]
    distractorNotes:
      gefliegt: "*fliegen* is irregular: *geflogen*."
      gefliegen: "The vowel changes: *fliegen → geflogen*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/009
    type: cloze
    level: A1
    skill: form
    text: "Wir sind am Sonntag {{gewandert}}."
    hint: "(wandern)"
    accepted: [gewandert]
    explanation: "*wandern* is regular: *ge- + wander + -t*; movement → *sein*."
    errorTags: [participle]
    distractorNotes:
      gewandern: "*wandern* is regular: *gewandert*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
