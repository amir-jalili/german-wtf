    explanation: "*springen* into something → movement → *sein*; plural: *sind*."
    errorTags: [aux-haben-sein]
    distractorNotes:
      haben: "*springen* is movement → *sein*: *sie sind gesprungen*."
      ist: "Right auxiliary, wrong person: *die Kinder* (plural) → *sind*."
      hat: "*springen* → *sein*, plural → *sind*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
