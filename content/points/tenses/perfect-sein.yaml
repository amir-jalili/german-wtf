    level: A1
    skill: form
    text: "Ich ___ gestern viel gelaufen."
    options: [bin, habe, hat, ist]
    answer: bin
    explanation: "*laufen* → movement → *sein*; for *ich*: *bin*."
    errorTags: [aux-haben-sein]
    distractorNotes:
      habe: "*laufen* is movement → *sein*: *ich bin gelaufen*."
      hat: "*laufen* takes *sein*, and *ich* needs *bin*."
      ist: "Right auxiliary, wrong person: *ich bin*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
  - id: perfect-sein/013
