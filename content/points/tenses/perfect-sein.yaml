    errorTags: [aux-haben-sein]
    distractorNotes:
      bin: "*trinken* is not movement or change of state → *haben*."
      hat: "Right auxiliary, wrong person: *ich habe*."
      ist: "*trinken* → *haben*, and *ich* → *habe*."
    review: { status: draft, by: claude, date: 2026-11-17 }
    source: original
